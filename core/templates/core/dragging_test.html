<!DOCTYPE html>
<html>
<head>
<style>
body {
    background-color: ivory;
}
#myCanvas3 {
    border:1px solid red;
}
</style>
</head>
<body>

<h4>Click to add a circle<br>Drag to move a circle.</h4>
<canvas id="myCanvas3" width=300 height=300></canvas>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>  
<script>
// ========== Dragging drawn dots ==========
var myCanvas3 = document.getElementById("myCanvas3");
var ctx3 = myCanvas3.getContext("2d");
var $myCanvas3 = $("#myCanvas3");
var canvasOffset = $myCanvas3.offset();
var offsetX = canvasOffset.left;
var offsetY = canvasOffset.top;
console.log("Offset x, y: " + offsetX + ", " + offsetY);
var scrollX = $myCanvas3.scrollLeft();
var scrollY = $myCanvas3.scrollTop();
var cw = myCanvas3.width;
var ch = myCanvas3.height;
console.log("Width: " + cw);
console.log("Height: " + ch);
        
// flag to indicate a drag is in process
// and the last XY position that has already been processed
var isDown = false;
var lastX;
var lastY;
        
// the radian value of a full circle is used often, cache it
var PI2 = Math.PI * 2;
        
// variables relating to existing circles
var circles = [];
var stdRadius = 10;
var draggingCircle = -1;
        
        
// clear the canvas and redraw all existing circles
function drawAll() {
    ctx3.clearRect(0, 0, cw, ch);
    for (var i = 0; i < circles.length; i++) {
        var circle = circles[i];
        ctx3.beginPath();
        ctx3.arc(circle.x, circle.y, circle.radius, 0, PI2);
        ctx3.closePath();
        ctx3.fillStyle = circle.color;
        ctx3.fill();
    }
}
        
function handleMouseDown(e) {
    // tell the browser we'll handle this event
    e.preventDefault();
    e.stopPropagation();
        
    // save the mouse position
    // in case this becomes a drag operation
    lastX = parseInt(e.clientX - offsetX);
    lastY = parseInt(e.clientY - offsetY);
        
    // hit test all existing circles
    var hit = -1;
    for (var i = 0; i < circles.length; i++) {
        var circle = circles[i];
        var dx = lastX - circle.x;
        var dy = lastY - circle.y;
        if (dx * dx + dy * dy < circle.radius * circle.radius) {
            hit = i;
        }
    }
        
    // if no hits then add a circle
    // if hit then set the isDown flag to start a drag
    if (hit < 0) {
        circles.push({
            x: lastX,
            y: lastY,
            radius: stdRadius,
            color: randomColor()
        });
        drawAll();
    } else {
        draggingCircle = circles[hit];
        isDown = true;
    }
        
}
        
function handleMouseUp(e) {
    // tell the browser we'll handle this event
    e.preventDefault();
    e.stopPropagation();
        
    // stop the drag
    isDown = false;
}
        
function handleMouseMove(e) {
        
    // if we're not dragging, just exit
    if (!isDown) {
        return;
    }
        
    // tell the browser we'll handle this event
    e.preventDefault();
    e.stopPropagation();
        
    // get the current mouse position
    mouseX = parseInt(e.clientX - offsetX);
    mouseY = parseInt(e.clientY - offsetY);
        
    // calculate how far the mouse has moved
    // since the last mousemove event was processed
    var dx = mouseX - lastX;
    var dy = mouseY - lastY;
        
    // reset the lastX/Y to the current mouse position
    lastX = mouseX;
    lastY = mouseY;
        
    // change the target circles position by the 
    // distance the mouse has moved since the last
    // mousemove event
    draggingCircle.x += dx;
    draggingCircle.y += dy;
        
    // redraw all the circles
    drawAll();
}
        
// listen for mouse events
$("#myCanvas3").mousedown(function (e) {
    handleMouseDown(e);
});
$("#myCanvas3").mousemove(function (e) {
    handleMouseMove(e);
});
$("#myCanvas3").mouseup(function (e) {
    handleMouseUp(e);
});
$("#myCanvas3").mouseout(function (e) {
    handleMouseUp(e);
});

//////////////////////
// Utility functions
        
function randomColor() {
    return ('#' + Math.floor(Math.random() * 16777215).toString(16));
}
// =====================================
</script>

</body>
</html>
