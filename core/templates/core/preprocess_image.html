<!DOCTYPE html>
<html>
    <head>
        <!-- <meta content="width=device-width, initial-scale=1" name="viewport" /> -->
        <style>
            .process-image {
                position: relative;
                left: 50%;
                transform: translateX(-50%);
                background-color: #2571c7d8;
                border: none;
                border-radius: 5px;
                color: white;
                padding: 10px 24px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 18px;
                margin: 4px 2px;
                transition-duration: 0.4s;
                cursor: pointer;
                font-family: "Papyrus", fantasy;
            }
            .process-image:hover {
                background-color: #5083bed8;
                color: white;
            }
            .text-field {
                display: none;
            }
            input[type="file"] { 
                display: none;
            }
            label[for="id_image"] {
                position: relative;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgb(59, 250, 84);
                border: none;
                border-radius: 4px;
                color: white;
                display: inline-block;
                padding: 10px 5px;
                cursor: pointer;
                font-size: 18px;
                font-family: "Monaco", monospace;
            }
            label[for="id_image"]:hover {
                background-color: rgb(114, 248, 114);
                color: white;
            }
            label[for="id_blur"] {
                display: none;
            }
            label[for="id_canny_thresh_1"] {
                display: none;
            }
            label[for="id_canny_thresh_2"] {
                display: none;
            }
            label[for="id_mask_dilate_iter"] {
                display: none;
            }
            label[for="id_mask_erode_iter"] {
                display: none;
            }
            label[for="id_mask_color_b"] {
                display: none;
            }
            label[for="id_mask_color_g"] {
                display: none;
            }
            label[for="id_mask_color_r"] {
                display: none;
            }
            /*Important for creating two-column layout*/
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
            }

            .header {
                background-color: whitesmoke;
                padding: 15px;
                text-align: left;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            .top-nav {
                overflow: hidden;
                background-color: rgba(0, 0, 0, 0.774);
            }
            .top-nav a {
                float: right;
                display: box;
                color: white;
                text-align: center;
                padding: 10px 10px;
                text-decoration: snow;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .top-nav a:hover {
                background-color: slategrey;
                color: snow;
            }

            /*Create two equal columns*/
            .column {
                float: left;
                width: 50%;
                padding: 15px;
            }
            /*Clear floats after the columns*/
            .row:after {
                content: "";
                display: table;
                clear: both;
            }
            /* @media screen and (max-width:600px) {
                .column {
                    width: 100%;
                }
            } */
            p.fadein {
                display: inline-block;
                /* position: fixed; */
                /* width: 400px;
                height: 300px; */
            }

            .fadein img {
                position: relative;
                clear: both;
                float: left;
                /* top:0; */
                -webkit-animation-name: fade;
                -webkit-animation-iteration-count: infinite;
                -webkit-animation-duration: 6s;
                animation-name: fade;
                animation-iteration-count: infinite;
                animation-duration: 6s;
            }
            div.sample-demo-box {
                display: inline-block;
                position: relative;
                /* width: 300px; */
                /* float: right; */
                left: 300px;
                top: 20px;
                border: 5px outset rgba(114, 207, 243, 0.658);
                padding: 50px;
                margin: 20px;
            }
            #post_form {
                position: relative;
            }
            div.upload-image-box {
                display: inline-block;
                position: relative;
                /* width: 300px; */
                /* float: right; */
                left: 150px;
                top: 180px;
                border: 3px dotted rgb(180, 255, 220);
                border-radius: 30px;
                padding: 50px;
                margin: 20px;
            }

            @-webkit-keyframes fade {
                0% {opacity: 0;}
                20% {opacity: 1;}
                33% {opacity: 1;}
                53% {opacity: 0;}
                100% {opacity: 0;}
            }
            @keyframes fade {
                0% {opacity: 0;}
                20% {opacity: 1;}
                33% {opacity: 1;}
                53% {opacity: 0;}
                100% {opacity: 0;}
            }

            #f1 {
                background-color: lightblue;
            }
            #f2 {
                -webkit-animation-delay: -4s;
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1><img src="../../../static/willogy_logo.png" alt="image" style="width:70px;height:70px;" class="company-logo"> Willogy</h1>
        </div>

        <div class="top-nav">
            <a href="#">About</a>
            <a href="#">Demo</a>
            <a href="#">Pricing</a>
        </div>

        <div class="row">
            <div class="column">
                <!-- <h2>Remove image background</h2>
                <p>Lorem ipsum</p> -->
                <div class="sample-demo-box">
                    <p class="fadein">
                        <img id="f2" src="../../../static/dog6.jpg" style="width:500px;height:300px;">
                        <img id="f1" src="../../../static/dog6_remove.jpg" style="width:500px;height:300px;">
                    </p>
                </div>
            </div>
            <div class="column">
                <!-- <p>Lorem ipsum</p> -->
                <h2>Remove image background</h2>
                {% load crispy_forms_tags %}
                <div class="upload-image-box">
                    <form id="post_form" method="post" enctype="multipart/form-data">
                        <!-- {% csrf_token %}
                        {% for hidden in postForm.hidden_fields %}
                            {{ hidden }}
                        {% endfor %}

                        {% for field in postForm %}
                            {{ field }} <br />
                        {% endfor %} -->

                        {% csrf_token %}
                        <!-- Read this to know about form.as_p: https://docs.djangoproject.com/en/3.2/topics/forms/-->
                        {{ form.as_p }}

                        <button class="process-image" type="submit">Process</button>
                    </form>
                </div>
                {% if img_obj %}
                    <img src="{{ img_obj.image.url }}" alt="connect" style="max-height:300px">
                {% endif %}
            </div>
        </div>
    </body>
</html>
