<!DOCTYPE html>
<html>
    <head>
        <!-- <meta content="width=device-width, initial-scale=1" name="viewport" /> -->
        <style>
            .process-image {
                background-color: #2571c7d8;
                border: none;
                border-radius: 5px;
                color: white;
                padding: 10px 24px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                transition-duration: 0.4s;
                cursor: pointer;
            }
            .process-image:hover {
                background-color: #5083bed8;
                color: white;
            }
            input[type="file"] { 
                display: none;
            }
            label[for="id_image"] {
                background-color: rgb(59, 250, 84);
                border: none;
                border-radius: 4px;
                color: white;
                display: inline-block;
                padding: 2px 2px;
                cursor: pointer;
            }
            label[for="id_image"]:hover {
                background-color: rgb(114, 248, 114);
                color: white;
            }
            /*Important for creating two-column layout*/
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
            }

            .header {
                background-color: whitesmoke;
                padding: 15px;
                text-align: left;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            .top-nav {
                overflow: hidden;
                background-color: rgba(0, 0, 0, 0.774);
            }
            .top-nav a {
                float: right;
                display: box;
                color: white;
                text-align: center;
                padding: 10px 10px;
                text-decoration: snow;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .top-nav a:hover {
                background-color: slategrey;
                color: snow;
            }

            /*Create two equal columns*/
            .column {
                float: left;
                width: 50%;
                padding: 15px;
            }
            /*Clear floats after the columns*/
            .row:after {
                content: "";
                display: table;
                clear: both;
            }
            /* @media screen and (max-width:600px) {
                .column {
                    width: 100%;
                }
            } */

        </style>
    </head>
    <body>
        <div class="header">
            <h1>Willogy</h1>
        </div>

        <div class="top-nav">
            <a href="#">About</a>
            <a href="#">Demo</a>
            <a href="#">Pricing</a>
        </div>

        <div class="row">
            <div class="column">
                <h2>Remove image background</h2>
                <p>Lorem ipsum</p>
            </div>
            <div class="column">
                <h2>Remove image background</h2>
                <p>Lorem ipsum</p>
                {% load crispy_forms_tags %}

                <form id="post_form" method="post" enctype="multipart/form-data">
                    <!-- {% csrf_token %}
                    {% for hidden in postForm.hidden_fields %}
                        {{ hidden }}
                    {% endfor %}

                    {% for field in postForm %}
                        {{ field }} <br />
                    {% endfor %} -->

                    {% csrf_token %}
                    <!-- Read this to know about form.as_p: https://docs.djangoproject.com/en/3.2/topics/forms/-->
                    {{ form.as_p }}

                    <button class="process-image" type="submit">Process</button>
                </form>

                {% if img_obj %}
                    <img src="{{ img_obj.image.url }}" alt="connect" style="max-height:300px">
                {% endif %}
            </div>
        </div>
    </body>
</html>
