version: "3.7"

services:
  db:
    image: postgres
    # volumes:
    #   - ./data1/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=signup.settings_docker
    depends_on:
      - db
    volumes:
      - .:/code
    ports:
      - "8000:8000"

